# Asks first-time contributors to sign CLA.md by commenting on their pull request.
# Signatures are stored in signatures/cla.json on the cla-signatures branch.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, pinned to the commit because this job can write to the repository.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/sami-yesha/telenotify/blob/main/CLA.md
          branch: cla-signatures
          # The project owner and bots don't need to sign.
          allowlist: sami-yesha,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Thanks for your contribution! 🙌 Before we can merge it, please read our [Contributor License Agreement](https://github.com/sami-yesha/telenotify/blob/main/CLA.md). In short: you keep the copyright, Telenotify stays open source, and the project may also license your contribution under other terms.

            To sign, post a comment on this pull request with exactly this text:
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you! ✅
